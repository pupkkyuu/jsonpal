name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate version and release notes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('标签必须与 package.json 版本一致，例如 v0.1.0');
          }
          const path = `docs/releases/${version}.md`;
          if (!readFileSync(path, 'utf8').trim()) {
            throw new Error(`版本说明不能为空：${path}`);
          }
          console.log(`Validated v${version} and ${path}`);
          NODE

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Publish packages and release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG#v}.md"
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi

          # Create a draft first, so a failed upload does not expose a partial release.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag --draft \
              --title "JSONPal $RELEASE_TAG" \
              --notes-file "$notes"
          fi

          # --clobber lets a failed run resume uploading to the same release.
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" \
            --title "JSONPal $RELEASE_TAG" \
            --notes-file "$notes" \
            --prerelease="$prerelease" \
            --draft=false
